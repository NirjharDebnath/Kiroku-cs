[project]
site_url = "https://nirjhardebnath.github.io/Kiroku-cs/"
site_name = "Kiroku CS"
site_description = "Comprehensive, rigorous notes for GATE CS & IT: Programming and Data Structures based on Gateopedia and recent GATE papers."
site_author = "Nirjhar Debnath"

repo_url = "https://github.com/NirjharDebnath/Kiroku-cs"
repo_name = "NirjharDebnath/Kiroku-cs"
edit_uri = "blob/main/docs/"

nav = [
  { "Overview & Syllabus Roadmap" = "index.md" },
  { "Programming in C" = [
    { "01. Data Types & Operators" = "programming/01-data-types-operators.md" },
    { "02. Control Flow & Loops" = "programming/02-control-flow.md" },
    { "03. Functions, Scoping & Recursion" = "programming/03-functions-scoping-recursion.md" },
    { "04. Arrays & Pointers" = "programming/04-arrays-pointers.md" },
    { "05. Strings & Memory Layout" = "programming/05-strings-memory-layout.md" },
  ]},
  { "Data Structures" = [
    { "01. Special Matrices & Linked Lists" = "data-structures/01-linear-matrices-linked-lists.md" },
    { "02. Stacks" = "data-structures/02-stacks.md" },
    { "03. Queues" = "data-structures/03-queues.md" },
    { "04. Binary Trees & Properties" = "data-structures/04-trees-binary-trees.md" },
    { "05. Binary Search Trees & AVL" = "data-structures/05-binary-search-trees-avl.md" },
    { "06. Binary Heaps & Priority Queues" = "data-structures/06-heaps-priority-queues.md" },
    { "07. Graph Traversals (BFS & DFS)" = "data-structures/07-graphs-traversals.md" },
    { "08. Hashing & Collision Resolution" = "data-structures/08-hashing.md" },
  ]},
  { "Algorithms & Complexity" = [
    { "01. Asymptotic Analysis & Recurrences" = "algorithms/01-asymptotic-analysis-recurrences.md" },
    { "02. Divide & Conquer and Searching" = "algorithms/02-divide-and-conquer-searching.md" },
    { "03. Sorting Algorithms & Selection" = "algorithms/03-sorting-algorithms-selection.md" },
    { "04. Greedy Algorithms & MST" = "algorithms/04-greedy-algorithms.md" },
    { "05. Dynamic Programming" = "algorithms/05-dynamic-programming.md" },
    { "06. Graph Algorithms & Shortest Paths" = "algorithms/06-graph-algorithms-shortest-paths.md" },
    { "07. NP-Completeness & Advanced Topics" = "algorithms/07-np-completeness-advanced-topics.md" },
  ]},
  { "GATE PYQs & Solutions" = [
    { "Recent GATE Papers (2024 - 2026)" = "gate-pyq/recent-gate-solutions.md" },
  ]},
]

extra_css = [
  "https://unpkg.com/katex@0/dist/katex.min.css",
  "stylesheets/extra.css",
]

extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
